<div class="modal-content">
  <div class="modal-header">
    <h2>Your Cart <span id="cart-item-count">(0)</span></h2>
    <button 
      type="button" 
      class="close-modal-btn" 
      id="close-cart-top" 
      aria-label="Close cart"
    >×</button>
  </div>

  <div id="cart-items" class="cart-items-list">
    <!-- Items inserted here dynamically -->
  </div>

  <div class="cart-summary">
    <div class="total-row">
      <span class="total-label">Subtotal</span>
      <span class="total-value">KSh <span id="cart-total">0</span></span>
    </div>
    <small>Delivery & taxes calculated at checkout</small>
  </div>

  <div class="cart-actions">
    <button 
      type="button" 
      id="checkout-btn" 
      class="btn-primary" 
      disabled
    >
      Proceed to Checkout
    </button>
    <button 
      type="button" 
      id="close-cart-bottom" 
      class="btn-secondary"
    >
      Continue Shopping
    </button>
  </div>

  <!-- Empty cart state -->
  <div id="empty-cart-message" class="empty-state hidden">
    <div class="empty-icon">🛒</div>
    <h3>Your cart is empty</h3>
    <p>Looks like you haven't added anything yet.</p>
    <button 
      type="button" 
      id="continue-shopping-btn" 
      class="btn-outline"
    >
      Start Shopping
    </button>
  </div>

  <!-- ──────────────────────────────────────────────── -->
  <!-- Inline script – activates when this fragment is loaded -->
  <!-- ──────────────────────────────────────────────── -->
  <script>
    (function() {
      // Wait for the next microtask so the elements are in the DOM
      queueMicrotask(() => {
        const modal = document.getElementById('cart-modal');
        if (!modal) {
          console.warn('cart-modal container not found');
          return;
        }

        // ─── All close buttons ────────────────────────────────
        const closeButtons = [
          document.getElementById('close-cart-top'),
          document.getElementById('close-cart-bottom'),
          document.getElementById('continue-shopping-btn')
        ];

        closeButtons.forEach(btn => {
          if (btn) {
            btn.addEventListener('click', () => {
              modal.style.display = 'none';
              console.log('Cart modal closed');
            });
          }
        });

        // ─── Checkout button ──────────────────────────────────
        const checkoutBtn = document.getElementById('checkout-btn');
        if (checkoutBtn) {
          checkoutBtn.addEventListener('click', () => {
            if (checkoutBtn.disabled) {
              alert("Your cart is empty — add some items first!");
              return;
            }

            // Mock checkout – replace with real logic later
            alert("✅ Proceeding to checkout...\n(This is a mock — real payment coming later)");

            // Optional: clear cart after checkout
            // window.myCart?.clear();
            // window.updateCartDisplay?.();

            modal.style.display = 'none';
          });
        }

        // ─── Click outside to close (backdrop) ────────────────
        modal.addEventListener('click', function(e) {
          if (e.target === modal) {
            modal.style.display = 'none';
          }
        });

        console.log('Cart modal navigation handlers attached (inline)');
      });
    })();
  </script>
</div>
