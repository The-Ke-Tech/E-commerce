<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEN&DENNO — Fixed Header with Working Icons</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Sticky header -->
    <nav class="main-nav">
        <div class="navbar container">
            <!-- Logo – clickable to home -->
            <a href="index.html" class="logo-wrapper" aria-label="Go to homepage">
                <div class="logo">BEN&DENNO</div>
            </a>

            <!-- Main navigation links -->
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="new-arrivals.html">New Arrivals</a></li>
                <li><a href="deals.html">Deals</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

            <!-- Right side icons -->
            <div class="nav-actions">
                <!-- Search toggle -->
                <button class="icon-btn search-btn" id="searchToggleBtn" aria-label="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </button>

                <!-- Account -->
                <a href="account.html" class="icon-btn" aria-label="My Account">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </a>

                <!-- Wishlist -->
                <a href="wishlist.html" class="icon-btn" aria-label="Wishlist">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                </a>

                <!-- Cart -->
                <button class="icon-btn cart-icon" id="cart-icon" aria-label="Shopping Cart">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"/>
                        <circle cx="20" cy="21" r="1"/>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                    </svg>
                    <span class="cart-count" id="cart-count">0</span>
                </button>

                <!-- Theme toggle -->
                <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle theme">
                    <svg class="sun" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <svg class="moon hidden" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>

            <!-- Mobile hamburger -->
            <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- Search overlay -->
    <div class="search-overlay" id="searchOverlay">
        <input type="text" placeholder="Search for products..." id="searchInput">
        <button id="searchSubmit">Search</button>
        <button class="close-search" id="closeSearch">✕</button>
    </div>

    <!-- Cart Modal -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Your Cart</h2>
                <button class="close-modal-btn" id="close-cart">×</button>
            </div>
            <div class="cart-items-list" id="cart-items-list">
                <!-- Items go here dynamically -->
            </div>
            <div class="cart-summary">
                <div class="total-row"><span>Subtotal</span><span>KSh <span id="cart-total">0</span></span></div>
            </div>
            <div class="cart-actions">
                <button class="btn-primary" id="checkout-btn">Checkout</button>
                <button class="btn-outline" id="continue-shopping">Continue Shopping</button>
            </div>
        </div>
    </div>

    
    <script src="js/script.js"></script>
</body>
</html>
